[project]
name = "athena"
version = "0.1.0"
description = "A small CLI oracle for engineering perspective and machine folklore"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ethan Carter"}]

[project.scripts]
athena = "athena:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["athena"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
